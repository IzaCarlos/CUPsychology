name: Validate JSON

on:
  pull_request:
    paths:
      - 'Assets/CasualtyPsychology/**/*.json'

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("Assets/CasualtyPsychology")

          files = list(root.rglob("*.json"))

          if not files:
              print("No JSON files found.")
              sys.exit(0)

          failed = False

          for path in files:
              print(f"Checking {path}...")

              try:
                  with path.open("r", encoding="utf-8") as f:
                      json.load(f)

              except json.JSONDecodeError as e:
                  print(
                      f"::error file={path},line={e.lineno},"
                      f"col={e.colno}::{e.msg}"
                  )
                  failed = True

              except UnicodeDecodeError as e:
                  print(
                      f"::error file={path}::Invalid UTF-8: {e}"
                  )
                  failed = True

          if failed:
              print("One or more JSON files are invalid.")
              sys.exit(1)

          print(f"Validated {len(files)} JSON file(s).")
          PY